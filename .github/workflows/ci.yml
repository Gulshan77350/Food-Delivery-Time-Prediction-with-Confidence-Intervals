name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --python 3.11
      # Unit tests use synthetic data; the app smoke test auto-skips without trained artifacts.
      - name: Test
        run: uv run pytest -q
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
